name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Install application dependencies
        run: npm ci

      - name: Install Copa Arena API dependencies
        run: npm ci --prefix services/copa-arena-api

      - name: Fast behavior contracts
        run: npm run test:contracts

      - name: Install Ghost API dependencies
        run: npm ci --prefix services/ghost-club-api

      - name: Test Ghost API
        run: npm run check --prefix services/ghost-club-api

      - name: Test Copa Arena API
        run: npm run check --prefix services/copa-arena-api

      - name: Install browser test dependencies
        run: npm ci --prefix playtest/runner

      - name: Install browser engine
        # Use runner-provided system libraries to avoid apt mirror stalls.
        run: npx --prefix playtest/runner playwright install chromium

      - name: Release browser contracts
        run: npm run test:release --prefix playtest/runner

      - name: Verify web and Android parity
        run: npm run check:parity

      - name: Verify public-release rights inventory
        run: npm run check:rights:public

      - name: Build Pages artifact
        run: npm run build:pages
        env:
          PUBLIC_RELEASE: '1'
          CF_WEB_ANALYTICS_TOKEN: ${{ vars.CF_WEB_ANALYTICS_TOKEN }}
          # Web AdSense stays disabled until Google approves the interactive
          # game screens. Keep the publisher records in ads.txt, but do not
          # request Google-served ads on game UI, menus, or empty states.
          COPA_WEB_ADS_APPROVED: '0'

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        with:
          timeout: 900000
          error_count: 120
          reporting_interval: 5000
