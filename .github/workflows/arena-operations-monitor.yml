name: Copa Arena operations monitor

on:
  schedule:
    - cron: '12,42 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: copa-arena-operations-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Probe production health
        run: node services/copa-arena-api/scripts/check-health.mjs
      - name: Check room delivery, settlement and alarm health
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
          ARENA_MONITOR_OUTPUT: outputs/arena/operations-monitor.json
        run: node services/copa-arena-api/scripts/operations-monitor.mjs
      - name: Upload monitor snapshot
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: copa-arena-operations-monitor
          path: outputs/arena/operations-monitor.json
          if-no-files-found: ignore
          retention-days: 14
