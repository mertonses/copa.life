name: Publish Google Play store listing

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to replace localized store text and graphics
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: google-play-store-listing
  cancel-in-progress: false

jobs:
  publish:
    environment:
      name: google-play-internal
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enforce main and confirmation
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$REF" = "refs/heads/main"
          test "$CONFIRM" = "PUBLISH"

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Validate localized assets
        run: node tools/check-android-store-assets.mjs

      - name: Publish localized text and graphics
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node tools/publish-google-play-listing.mjs --commit
