<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Copa Life · Sonuç Ekranı Mockup v2</title>
  <style>
    :root{--bg:#09141e;--bg2:#0f202b;--panel:#122632;--panel2:#182d39;--line:#34434b;--muted:#8d9ba5;--text:#f3f5f4;--red:#f24a28;--gold:#d6a21f;--green:#4e9b65;--slate:#aeb8ba;--display:Impact,"Arial Narrow",Arial,sans-serif;--body:"Arial Narrow",Arial,sans-serif}
    *{box-sizing:border-box} body{margin:0;min-height:100vh;background:radial-gradient(circle at 75% -15%,#1c3542 0,#0d1e2b 42%,var(--bg) 100%);color:var(--text);font-family:var(--body)} button{font:inherit;cursor:pointer;color:inherit}.page{width:min(1180px,calc(100% - 48px));margin:auto;padding:28px 0 56px}.mast{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #2a404b;padding-bottom:18px;margin-bottom:26px}.brand{font-size:14px;font-weight:900;letter-spacing:2px}.brand i{font-style:normal;color:var(--red)}.mast small{color:var(--muted);font-size:10px;letter-spacing:1.5px}.statebar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.statebar button{border:1px solid var(--line);background:#132632;color:var(--muted);padding:9px 13px;border-radius:3px;font-size:10px;font-weight:900;letter-spacing:1.2px}.statebar button.active{background:var(--text);border-color:var(--text);color:var(--bg)}.label{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.intro{display:flex;justify-content:space-between;align-items:end;margin-bottom:16px}.intro h1{font:400 clamp(34px,5vw,58px)/.9 var(--display);letter-spacing:1px;margin:8px 0 0}.intro p{max-width:380px;margin:0;color:#a9b7b9;font-size:13px;line-height:1.45;text-align:right}.result-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:linear-gradient(145deg,#152a35,#0c1b25);box-shadow:0 24px 70px #0006}.hero{display:grid;grid-template-columns:minmax(0,1fr) 180px;gap:24px;align-items:center;padding:25px 30px 23px;border-bottom:1px solid #304650;position:relative}.hero:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 0 58%,rgba(242,74,40,.04) 58% 72%,transparent 72%)}.hero-copy,.scorebox{position:relative;z-index:1}.hero-kicker{color:var(--muted);font-size:10px;font-weight:900;letter-spacing:2px}.hero h2{font:400 clamp(48px,8vw,86px)/.86 var(--display);letter-spacing:2px;margin:12px 0 8px;color:var(--red)}.hero p{margin:0;color:#aeb8ba;font-size:13px;line-height:1.4}.scorebox{text-align:right}.scorebox strong{display:block;font:400 60px/.9 var(--display);letter-spacing:2px}.scorebox small{display:block;margin-top:9px;color:var(--muted);font-size:10px;letter-spacing:1.3px}.snapshot{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:18px 30px;border-bottom:1px solid #2a414b;background:#10232d}.metric{min-width:0;border-left:2px solid #40515a;padding-left:13px}.metric:first-child{border-left-color:var(--red)}.metric small{display:block;color:var(--muted);font-size:9px;letter-spacing:1.4px;margin-bottom:6px}.metric strong{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metric.good strong{color:var(--green)}.metric.gold strong{color:var(--gold)}.storyline{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(220px,.8fr);gap:12px;padding:16px 30px;background:#0e2029}.story-card{border:1px solid #304852;background:#142a35;border-radius:6px;padding:15px 16px}.story-card .label{font-size:9px;letter-spacing:1.5px}.story-card h3{font-size:15px;margin:8px 0 5px}.story-card p{margin:0;color:#b6c1c4;font-size:12px;line-height:1.4}.story-card.action{border-color:#52616a;background:linear-gradient(135deg,#192f3a,#13242e)}.story-card.action strong{display:block;color:var(--gold);font-size:21px;margin:8px 0 3px}.actionbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 30px;background:#0b1b24}.actionbar p{margin:0;color:var(--muted);font-size:12px}.actions{display:flex;gap:8px;flex-shrink:0}.btn{border:1px solid var(--line);background:transparent;border-radius:3px;padding:12px 16px;font-size:10px;font-weight:900;letter-spacing:1.2px}.btn.primary{border-color:var(--text);background:var(--text);color:var(--bg)}.btn.primary span{color:var(--red);font-size:14px;margin-left:5px}.drawer{display:none;border-top:1px solid #304650;padding:20px 30px;background:#0a1922}.drawer.open{display:block}.drawer-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.drawer-head h3{margin:0;font-size:11px;letter-spacing:1.7px}.drawer-grid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:12px}.drawer-card{min-height:118px;border:1px solid #2e4751;background:#122733;padding:15px}.drawer-card h4{color:var(--muted);font-size:9px;letter-spacing:1.4px;margin:0 0 12px}.drawer-card p{margin:0;color:#dbe2e4;font-size:12px;line-height:1.45}.bars{display:grid;gap:7px}.bar{display:grid;grid-template-columns:55px 1fr 28px;gap:8px;align-items:center;color:#b9c4c6;font-size:10px}.bar i{display:block;height:5px;border-radius:5px;background:#2d424c;overflow:hidden}.bar i:after{content:"";display:block;height:100%;width:var(--w);background:var(--green)}.variant-champion .hero{border-color:#356346}.variant-champion .hero h2{color:var(--gold)}.variant-champion .story-card.action strong{color:var(--green)}.variant-sacked .hero{background:linear-gradient(120deg,#101a21,#0d151b)}.variant-sacked .hero h2{color:var(--slate)}.variant-sacked .hero:after{background:repeating-linear-gradient(170deg,transparent 0 38px,rgba(174,184,186,.05) 38px 40px)}.variant-sacked .metric:first-child{border-left-color:#68757c}.variant-sacked .story-card.action strong{color:var(--slate)}.mobile-note{display:none}
    @media(max-width:700px){.page{width:min(100% - 24px,560px);padding:16px 0 28px}.mast{margin-bottom:16px}.mast small{display:none}.intro{display:block}.intro p{text-align:left;margin-top:10px}.hero{grid-template-columns:minmax(0,1fr) 94px;gap:12px;padding:21px 18px 18px}.hero h2{font-size:clamp(42px,13vw,64px);margin-top:10px}.hero p{font-size:12px}.scorebox strong{font-size:44px}.scorebox small{text-align:right;font-size:8px}.snapshot{grid-template-columns:repeat(2,1fr);gap:14px 0;padding:16px 18px}.storyline{grid-template-columns:1fr;padding:12px 18px}.story-card{padding:13px}.story-card.action{display:grid;grid-template-columns:1fr auto;align-items:center;gap:10px}.story-card.action strong{margin:0;text-align:right}.actionbar{display:block;padding:15px 18px}.actionbar p{margin-bottom:12px}.actions{display:grid;grid-template-columns:1fr 1fr}.actions .btn{width:100%;padding:12px 8px}.actions .primary{grid-column:1/-1}.drawer{padding:16px 18px}.drawer-grid{grid-template-columns:1fr}.mobile-note{display:block;margin:13px 0 0;color:var(--muted);font-size:10px;line-height:1.4}}
  </style>
</head>
<body>
  <main class="page">
    <header class="mast"><div class="brand">COPA <i>LIFE</i></div><small>SONUÇ EKRANI · MOCKUP V2</small></header>
    <nav class="statebar" aria-label="Durum seçimi"><button class="active" data-state="eliminated">ELENDİN</button><button data-state="champion">ŞAMPİYON</button><button data-state="sacked">KOVULDUN</button></nav>
    <section class="intro"><div><div class="label">SEZON SONU · 04</div><h1>NE OLDU.<br>NE KALDI.</h1></div><p>İlk bakışta sonucu, ikinci bakışta hikâyeyi gösteren kompakt sezon özeti.</p></section>
    <article class="result-card" id="resultCard"></article>
    <p class="mobile-note">Mobilde ana aksiyon kartın içinde kalır; ekranın en altında kopuk bir buton oluşmaz.</p>
  </main>
  <script>
    const data={
      eliminated:{kicker:'TÜRKİYE ULUSAL KUPASI · ÇEYREK FİNAL',title:'ELENDİN',sub:'Kupanın son adımına iki maç kala yolculuk sona erdi.',score:'1—2',scoreLabel:'MAÇ SONUCU',metric:['ÇEYREK FİNAL','78','€12M','+24'],story:'Kısıtlı bütçeyle çeyrek finale ulaşan ekip, güçlü rakibine karşı maçı uzun süre dengede tuttu.',action:'Bir sonraki sezonda aynı omurgayı koru.',cta:'KADROYU İNCELE',best:'Arda Yılmaz',target:'+1'},
      champion:{kicker:'TÜRKİYE ULUSAL KUPASI · FİNAL',title:'ŞAMPİYON',sub:'Finali kontrol ettin. Kupa artık kulüp tarihinin parçası.',score:'2—1',scoreLabel:'MAÇ SONUCU',metric:['ŞAMPİYON','84','€28M','+61'],story:'Sezon boyunca kurduğun denge finalde karşılığını buldu; takım baskı altında da planını korudu.',action:'Kupayı savunacak çekirdeği kur.',cta:'KUPA KAYDINI AÇ',best:'Mert Kaya',target:'+3'},
      sacked:{kicker:'YÖNETİM KARARI · SEZON SONU',title:'KOVULDUN',sub:'Borç krizi yönetimin sabrını bitirdi.',score:'—',scoreLabel:'SEZON DURUMU',metric:['GRUP · 3. MAÇ','83','-€29M','−12'],story:'Yönetim değişti; kulüp kariyerin kayda geçti. Yeni başlangıç için ders: kasa dengesini koru.',action:'Yeni bir kulüple yeniden başla.',cta:'YENİ KARİYER',best:'—',target:'KASA'}
    };
    const labels=['ULAŞILAN TUR','KADRO GÜCÜ','KULÜP KASASI','KULÜP İTİBARI'];let current='eliminated';let open=false;
    function render(){const d=data[current],card=document.querySelector('#resultCard');card.className=`result-card variant-${current}`;card.innerHTML=`<div class="hero"><div class="hero-copy"><div class="hero-kicker">${d.kicker}</div><h2>${d.title}</h2><p>${d.sub}</p></div><div class="scorebox"><strong>${d.score}</strong><small>${d.scoreLabel}</small></div></div><div class="snapshot">${d.metric.map((x,i)=>`<div class="metric ${i===1?'good':''} ${i===3?'gold':''}"><small>${labels[i]}</small><strong>${x}</strong></div>`).join('')}</div><div class="storyline"><div class="story-card"><div class="label">SEZONUN HİKÂYESİ</div><h3>${d.story.split(',')[0]}</h3><p>${d.story.split(',').slice(1).join(',')}</p></div><div class="story-card action"><div><div class="label">SONRAKİ KARAR</div><strong>${d.target}</strong><p>${d.action}</p></div></div></div><div class="actionbar"><p>${current==='champion'?'Kupa kulüp tarihine işlendi.':current==='sacked'?'Yönetim değişti; kariyerin kayda geçti.':'Bu tur kaybolmadı. Kulüp kariyerine işlendi.'}</p><div class="actions"><button class="btn" id="share">PAYLAŞ</button><button class="btn" id="next">İSTATİSTİKLER <span>↓</span></button><button class="btn primary">${d.cta}<span>→</span></button></div></div>${open?`<section class="drawer open"><div class="drawer-head"><h3>SEZON KAYDI</h3><button class="btn" id="close">KAPAT</button></div><div class="drawer-grid"><div class="drawer-card"><h4>HİKÂYE NOTU</h4><p>${d.story} Bu kayıt, kulüp kariyerinin sezon günlüğüne eklendi.</p></div><div class="drawer-card"><h4>SEZON KARNESİ</h4><div class="bars"><div class="bar"><span>Hücum</span><i style="--w:76%"></i><b>76</b></div><div class="bar"><span>Uyum</span><i style="--w:68%"></i><b>68</b></div><div class="bar"><span>Finans</span><i style="--w:${current==='sacked'?18:62}%"></i><b>${current==='sacked'?18:62}</b></div></div></div><div class="drawer-card"><h4>ÖNE ÇIKAN</h4><p><b>${d.best}</b><br>${current==='sacked'?'Bu sezonun en kritik dersi: riskleri erken yönet.':'Sezonun karar anlarında takımın dengesini taşıdı.'}</p></div></div></section>`:''}`;document.querySelector('#next').onclick=()=>{open=!open;render()};document.querySelector('#share').onclick=()=>alert('Mockup: paylaşım akışı');if(open)document.querySelector('#close').onclick=()=>{open=false;render()}}
    document.querySelectorAll('[data-state]').forEach(b=>b.onclick=()=>{current=b.dataset.state;open=false;document.querySelectorAll('[data-state]').forEach(x=>x.classList.toggle('active',x===b));render()});render();
  </script>
</body>
</html>
