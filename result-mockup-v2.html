    let language='tr',state='eliminated',hubOpen=false;
    const t=(obj)=>obj&&obj[language]!==undefined?obj[language]:obj;
    function metric(label,value,kind,iconName){return `<div class="cl-metric"><small><span class="cl-metric-icon">${icon(iconName)}</span>${label}</small><strong class="${kind||''}">${value}</strong></div>`}
    function renderStateButtons(){const labels=copy[language].states;document.querySelectorAll('[data-state]').forEach(button=>{const key=button.dataset.state;button.innerHTML=`${icon(key==='champion'?'trophy':key==='sacked'?'briefcase':'x')}<span>${labels[key]}</span>`;button.classList.toggle('active',key===state);button.setAttribute('aria-pressed',key===state?'true':'false')})}
    function render(){const c=copy[language],d=copy.states[state],p=document.querySelector('#resultPanel'),note=state==='sacked'?(language==='tr'?'YÖNETİM NOTU':'BOARD NOTE'):state==='champion'?(language==='tr'?'KULÜP KAYDI':'CLUB RECORD'):(language==='tr'?'SEZON NOTU':'SEASON NOTE');document.documentElement.lang=language;p.className=`cl-result ${state}`;p.innerHTML=`<div class="cl-hero"><div class="cl-hero-copy"><div class="cl-status-kicker">${t(d.kicker)}</div><div class="cl-status-title">${t(d.title)}</div><p class="cl-status-sub">${t(d.sub)}</p></div><div class="cl-status-mark">${icon(state==='champion'?'trophy':state==='sacked'?'briefcase':'x')}</div><div class="cl-score"><strong>${d.score}</strong><small>${d.score==='—'?c.labels.seasonStatus:c.labels.matchResult}</small></div></div><div class="cl-summary">${metric(c.labels.stage,t(d.stage),'',state==='champion'?'trophy':'info')}${metric(c.labels.power,d.power,'good','users')}${metric(c.labels.cash,d.cash,d.cash.startsWith('−')?'bad':'','briefcase')}${metric(c.labels.rep,d.rep,d.rep.startsWith('−')?'bad':'gold','chart')}</div><div class="cl-story"><article class="cl-story-card"><div class="cl-story-head"><div class="cl-kicker">${c.labels.story}</div><span class="cl-story-status"><i></i>${note}</span></div><h2>${t(d.storyTitle)}</h2><p>${t(d.storyText)}</p><div class="cl-story-trace"><div class="cl-trace-step ${d.trace[0]?'done':''}">${language==='tr'?'GRUP':'GROUP'}</div><div class="cl-trace-step ${d.trace[1]?'done':''} ${state==='eliminated'?'current':''}">${language==='tr'?'ÇEYREK FİNAL':'QUARTER-FINAL'}</div><div class="cl-trace-step ${d.trace[2]?'current':''} ${state==='sacked'?'locked':''}">${language==='tr'?'FİNAL':'FINAL'}</div></div></article><article class="cl-story-card cl-decision"><div><div class="cl-kicker">${c.labels.decision}</div><h2>${language==='tr'?'YENİ TUR':'NEW ROUND'}</h2><p>${t(d.decision)}</p></div><div class="cl-decision-foot"><span>${language==='tr'?'Bir sonraki hamle':'Your next move'}</span>${icon('arrow')}</div></article></div><div class="cl-actions"><button type="button" class="cl-action secondary" id="shareAction">${icon('share')}<span>${c.labels.share}</span></button><button type="button" class="cl-action secondary" id="hubAction">${icon('chart')}<span>${c.labels.hub}</span><span class="arrow">${hubOpen?'↑':'↓'}</span></button><button type="button" class="cl-action squad" id="squadAction">${icon('users')}<span>${c.labels.squad}</span><span class="arrow">→</span></button><button type="button" class="cl-action new-round" id="newRoundAction">${icon('arrow')}<span>${c.labels.newRound}</span></button></div><section class="cl-datahub" ${hubOpen?'':'hidden'}><div class="cl-datahead"><h2>${c.labels.datahub} <span>· ${c.labels.performance} · ${c.labels.impact}</span></h2><button type="button" id="closeHub">${c.labels.close}</button></div><div class="cl-data-grid"><article class="cl-data-card story"><h3>${c.labels.storyNote}</h3><p>${t(d.storyText)}</p><span class="cl-chip"><i></i>${t(d.storyMark)}</span></article><article class="cl-data-card"><h3>${c.labels.performance}</h3><div class="cl-bars"><div class="cl-bar-row"><span>${c.labels.attack}</span><div class="cl-bar-track"><span class="cl-bar-fill" style="width:${state==='champion'?89:state==='sacked'?55:76}%"></span></div><b>${state==='champion'?89:state==='sacked'?55:76}</b></div><div class="cl-bar-row"><span>${c.labels.chemistry}</span><div class="cl-bar-track"><span class="cl-bar-fill" style="width:${state==='champion'?86:state==='sacked'?42:68}%"></span></div><b>${state==='champion'?86:state==='sacked'?42:68}</b></div><div class="cl-bar-row"><span>${c.labels.finance}</span><div class="cl-bar-track"><span class="cl-bar-fill ${state==='sacked'?'warn':''}" style="width:${d.fin}%"></span></div><b>${d.fin}</b></div></div></article><article class="cl-data-card"><h3>${c.labels.impact}</h3><div class="cl-data-stat"><span>${c.labels.reputation}</span><b class="${d.rep.startsWith('−')?'bad':'gold'}">${d.rep}</b></div><div class="cl-data-stat"><span>${c.labels.finance}</span><b class="${state==='sacked'?'bad':'good'}">${d.fin}/100</b></div><div class="cl-data-stat"><span>${c.labels.standout}</span><b>${t(d.standout)}</b></div></article></div></section>`;renderStateButtons();document.querySelector('#hubAction').onclick=()=>{hubOpen=!hubOpen;render()};document.querySelector('#closeHub').onclick=()=>{hubOpen=false;render()};document.querySelector('#shareAction').onclick=()=>alert(language==='tr'?'Mockup: paylaşım kartı açılır.':'Mockup: share card opens.');document.querySelector('#squadAction').onclick=()=>alert(language==='tr'?'Mockup: kadro özeti açılır.':'Mockup: squad summary opens.');document.querySelector('#newRoundAction').onclick=()=>alert(language==='tr'?'Mockup: yeni tur başlıyor.':'Mockup: new round starts.')}
    document.querySelectorAll('[data-state]').forEach(button=>button.addEventListener('click',()=>{state=button.dataset.state;hubOpen=false;render()}));document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{language=button.dataset.lang;document.querySelectorAll('[data-lang]').forEach(x=>{x.classList.toggle('active',x.dataset.lang===language);x.setAttribute('aria-pressed',x.dataset.lang===language?'true':'false')});document.querySelector('#pageMicrocopy').textContent=copy[language].pageMicro;document.querySelector('#pageKicker').textContent=copy[language].kicker;document.querySelector('#pageTitle').innerHTML=copy[language].title;document.querySelector('#pageIntro').textContent=copy[language].intro;document.querySelector('#pageFoot').textContent=copy[language].foot;render()}));
    document.querySelector('#pageMicrocopy').textContent=copy.tr.pageMicro;document.querySelector('#pageKicker').textContent=copy.tr.kicker;document.querySelector('#pageTitle').innerHTML=copy.tr.title;document.querySelector('#pageIntro').textContent=copy.tr.intro;document.querySelector('#pageFoot').textContent=copy.tr.foot;render();
  </script>
</body>
</html>
